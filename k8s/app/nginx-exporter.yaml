---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: demo-app
  labels:
    app: nginx-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args:
            - "-nginx.scrape-uri=http://web-app.demo-app.svc.cluster.local:80/nginx_status"
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter
  namespace: demo-app
  labels:
    app: nginx-exporter
spec:
  type: ClusterIP
  selector:
    app: nginx-exporter
  ports:
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
